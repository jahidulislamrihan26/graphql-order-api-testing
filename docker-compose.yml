# PostgreSQL and Redis for running the service and the full test suite against the real thing:
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:postgres@localhost:5432/shop REDIS_URL=redis://localhost:6379 npm test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
